[project]
name = "polyhub-worker"
version = "0.1.0"
description = "Always-on paper trader engine for Polymarket Hub"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "supabase>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
